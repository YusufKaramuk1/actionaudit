name: Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ActionAudit
        run: pip install -e .

      - name: Scan our own workflows
        run: actionaudit scan .github/workflows --fail-on medium
