[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionaudit"
version = "0.4.0"
description = "Static security scanner for GitHub Actions workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yusuf Karamuk" },
]
keywords = [
    "security",
    "github-actions",
    "static-analysis",
    "ci-cd",
    "devsecops",
    "sast",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pygments>=2.17",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
actionaudit = "actionaudit.cli:cli"

[project.urls]
Homepage = "https://github.com/YusufKaramuk1/actionaudit"
Repository = "https://github.com/YusufKaramuk1/actionaudit"
Issues = "https://github.com/YusufKaramuk1/actionaudit/issues"
Changelog = "https://github.com/YusufKaramuk1/actionaudit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actionaudit = ["reporters/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# tomli is only installed on Python 3.10 (3.11+ uses stdlib tomllib), so mypy
# must not fail when it is absent from the type-check environment.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
